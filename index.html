<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>𝖚𝖘𝖎𝖈💕🌹𝕮𝖍𝖔𝖎𝖈𝖊𝖘</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Trebuchet MS", Arial, sans-serif;
}

/*  */
.container {
    position: relative;
    width: 1308px;
    height: 486px;
    background: transparent;
}

/*  */
.video-wrapper {
    position: absolute;
    width: 290px;
    height: 486px;
    overflow: hidden;
    border-radius: 12px;
    z-index: 2;
}

video.side-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.left-video-wrapper { left: 10px; top: 0; }
.right-video-wrapper { right: 10px; top: 0; }

/*  */
.center-video-wrapper {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 728px;
    height: 486px;
    overflow: hidden;
    border-radius: 12px;
    z-index: 3;
}

.center-video-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/*  */
.video-text {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px; 
    font-weight: bold;
    color: #ffffffcc;
    text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 15px #0088ff;
    white-space: nowrap;
    z-index: 4;
    animation: flashHeartbeat 25s infinite;
}

/*  */
@keyframes flashHeartbeat {
    0%, 20% {
        opacity: 1;
        bottom: 50%;
        transform: translateX(-50%) scale(1);
    }
    5%, 15% {
        transform: translateX(-50%) scale(1.2); 
    }
    21%, 100% {
        opacity: 0;
        bottom: 8px;
        transform: translateX(-50%) scale(1);
    }
}
</style>
</head>
<body>

<div class="container">

  <!--  -->
  <div class="video-wrapper left-video-wrapper">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://choises.github.io/hs/ne.mp4" type="video/mp4">
    </video>
    <div class="video-text">MUSIC CHOICES</div>
  </div>

  <!--  -->
  <div class="video-wrapper right-video-wrapper">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://choises.github.io/hs/ne.mp4" type="video/mp4">
    </video>
    <div class="video-text">MUSIC CHOICES</div>
  </div>
<script>

    var message = "𝕸𝖚𝖘𝖎𝖈💕🌹𝕮𝖍𝖔𝖎𝖈𝖊𝖘";

    function clickIE4() {
        if (event.button == 2) {
            alert(message);
            return false;
        }
    }

    function clickNS4(e) {
        if (document.layers || document.getElementById && !document.all) {
            if (e.which == 2 || e.which == 3) {
                alert(message);
                return false;
            }
        }
    }

    if (document.layers) {
        document.captureEvents(Event.MOUSEDOWN);
        document.onmousedown = clickNS4;
    } else if (document.all && !document.getElementById) {
        document.onmousedown = clickIE4;
    }

    document.oncontextmenu = new Function("alert(message);return false")
</script>
<script>

    function disableselect(e) {
        return false
    }
    function reEnable() {
        return true
    }
    document.onselectstart = new Function("return false")
    if (window.sidebar) {
        document.onmousedown = disableselect
        document.onclick = reEnable
    }
</script>
<script>
        window.oncontextmenu = function () {
            console.log("Right Click Disabled");
            return false;
        }
    </script><script type="x-shader/x-fragment" id="fragmentshader">
  uniform sampler2D baseTexture;
	uniform sampler2D bloomTexture;
	varying vec2 vUv;
	void main() {
		gl_FragColor = ( texture2D( baseTexture, vUv ) + vec4( 1.0 ) * texture2D( bloomTexture, vUv ) );
	}
</script>
</div>

</body>
</html>
